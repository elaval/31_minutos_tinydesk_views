        label: "Visualizaciones",
        grid: true
      },

        Plot.lineY(data, {
          x: d => new Date(d.timestamp),
          y: "viewCount",
          stroke: "#e74c3c",

          strokeWidth: 2

        Plot.dot(data, {
          x: d => new Date(d.timestamp),
          y: "viewCount",

          channels: {
            "hora":{value:"timestamp", label:"Hora local en Chile"}

            format:{
              "x":false,

            }

  <script id="6" type="module" hidden="">
    import moment from "npm:moment";
  </script>
  <script id="7" type="module" hidden="">
    // Evolución diaria: último registro de cada día (hora de Chile)
    const porDia = new Map();
    for (const d of data) porDia.set(d.timestamp.slice(0, 10), d.viewCount);
    const diario = [...porDia].map(([dia, views]) => ({date: new Date(dia + "T12:00:00Z"), views}));

    const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const fmtDia = (d) => `${d.getUTCDate()} ${meses[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    const fmtNum = (n) => n.toLocaleString("es-CL");

    const ultimo = diario.at(-1);
    // Promedios con los mismos días completos del gráfico de visualizaciones diarias
    const promedio30 = d3.mean(diarias.slice(-30), (d) => d.views);
    const promedio7 = d3.mean(diarias.slice(-7), (d) => d.views);

    // Primer día en que se cruza cada hito de 5 millones
    const hitos = [];
    for (let m = 10e6; m <= ultimo.views; m += 5e6) {
      const d = diario.find((d) => d.views >= m);
      hitos.push({...d, label: `${m / 1e6} M · ${fmtDia(d.date)}`});
    }

    const azul = "#2a78d6", grilla = "#e1e0d9", tinta = "#52514e", tenue = "#898781";

    const tarjeta = (etiqueta, valor) => {
      const el = document.createElement("div");
      el.style.cssText = "background:#f4f3ef;border-radius:8px;padding:12px 16px;min-width:180px";
      el.innerHTML = `<div style="font-size:13px;color:${tinta}">${etiqueta}</div>
        <div style="font-size:24px;font-weight:500;font-variant-numeric:tabular-nums">${valor}</div>`;
      return el;
    };
    const tarjetas = document.createElement("div");
    tarjetas.style.cssText = "display:flex;flex-wrap:wrap;gap:12px;margin:0 0 16px";
    tarjetas.append(
      tarjeta(`Visualizaciones al ${fmtDia(ultimo.date)}`, `${(ultimo.views / 1e6).toLocaleString("es-CL", {maximumFractionDigits: 2})} M`),
      tarjeta("Promedio diario, últimos 30 días", fmtNum(Math.round(promedio30))),
      tarjeta("Promedio diario, últimos 7 días", fmtNum(Math.round(promedio7)))
    );

    const evolucion = Plot.plot({
      title: "31 Minutos Tiny Desk - Evolución de las visualizaciones",
      caption: `Fuente: YouTube Data API v3, video «31 Minutos: Tiny Desk Concert» (NPR Music). Último registro diario del conteo de visualizaciones, recogido cada hora con GitHub Actions; serie desde el 8-10-2025 (el video se publicó el 6-10-2025). Gráfico: @elaval · MindTheContext.`,
      width: 800,
      height: 400,
      marginLeft: 50,
      marginTop: 24,
      style: {fontSize: 13, color: tenue},
      x: {type: "utc", label: null, ticks: d3.utcMonth.every(2), tickFormat: (d) => meses[d.getUTCMonth()] + (d.getUTCMonth() === 0 ? " " + d.getUTCFullYear() : "")},
      y: {domain: [0, Math.ceil(ultimo.views / 5e6) * 5e6], label: null, ticks: 5, tickFormat: (v) => `${v / 1e6} M`},
      marks: [
        Plot.gridY({ticks: 5, stroke: grilla, strokeOpacity: 1}),
        Plot.ruleY([0], {stroke: grilla}),
        Plot.areaY(diario, {x: "date", y: "views", fill: azul, fillOpacity: 0.1}),
        Plot.lineY(diario, {x: "date", y: "views", stroke: azul, strokeWidth: 2}),
        Plot.dot(hitos, {x: "date", y: "views", r: 4.5, fill: azul, stroke: "white", strokeWidth: 2}),
        // El primer hito queda pegado al eje: su etiqueta va a la derecha
        Plot.text(hitos.slice(0, 1), {x: "date", y: "views", text: "label", textAnchor: "start", dx: 8, dy: 4, fill: tinta}),
        Plot.text(hitos.slice(1), {x: "date", y: "views", text: "label", textAnchor: "end", dx: -8, dy: -10, fill: tinta}),
        Plot.ruleX(diario, Plot.pointerX({x: "date", stroke: tenue, strokeDasharray: "3,3"})),
        Plot.dot(diario, Plot.pointerX({x: "date", y: "views", r: 4, fill: azul, stroke: "white", strokeWidth: 2})),
        Plot.tip(diario, Plot.pointerX({x: "date", y: "views", title: (d) => `${fmtDia(d.date)}\n${fmtNum(d.views)} visualizaciones`}))
      ]
    });

    display(tarjetas);
    display(evolucion);
  </script>
  <script id="8" type="module" hidden="">
    // Visualizaciones diarias: conteo acumulado interpolado a medianoche (hora de Chile, -03:00)
    // entre registros, porque el workflow no corre siempre a la misma hora
    const pts = data
      .map((d) => [new Date(d.timestamp).getTime(), d.viewCount])
      .sort((a, b) => a[0] - b[0]);
    const enHora = (t) => {
      const i = d3.bisector((p) => p[0]).left(pts, t);
      if (i === 0 || i >= pts.length) return null;
      const [t0, v0] = pts[i - 1], [t1, v1] = pts[i];
      return v0 + ((v1 - v0) * (t - t0)) / (t1 - t0);
    };

    const diarias = [];
    for (let t = Date.parse("2025-12-26T00:00:00-03:00"); ; t += 864e5) {
      const a = enHora(t), b = enHora(t + 864e5);
      if (b === null) break;
      diarias.push({date: new Date(t + 12 * 36e5), views: b - a});
    }
    diarias.forEach((d, i) => {
      d.media7 = i >= 6 ? d3.mean(diarias.slice(i - 6, i + 1), (x) => x.views) : null;
    });
    const anio = diarias.filter((d) => d.date.getUTCFullYear() >= 2026);

    const mesesD = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const fmtDiaD = (d) => `${d.getUTCDate()} ${mesesD[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    const fmtNumD = (n) => Math.round(n).toLocaleString("es-CL");

    // El concierto fue la noche del 30 de abril en CDMX; el efecto se concentra el 1 de mayo
    const zocalo = anio.filter((d) => d.date.toISOString().startsWith("2026-05-01"))
      .map((d) => ({...d, label: `Concierto gratuito en el Zócalo de CDMX (30 abr)\n1 may: ${fmtNumD(d.views)} visualizaciones`}));

    const azulD = "#2a78d6", grillaD = "#e1e0d9", tintaD = "#52514e", tenueD = "#898781", grisD = "#b4b2a9";

    const graficoDiario = Plot.plot({
      title: "31 Minutos Tiny Desk - Visualizaciones diarias en 2026",
      subtitle: "Visualizaciones de cada día (puntos) y media móvil de 7 días (línea)",
      caption: "Fuente: YouTube Data API v3, video «31 Minutos: Tiny Desk Concert» (NPR Music). Visualizaciones diarias = diferencia del conteo acumulado a medianoche (hora de Chile), interpolado entre registros horarios. Gráfico: @elaval · MindTheContext.",
      width: 800,
      height: 400,
      marginLeft: 60,
      marginTop: 24,
      style: {fontSize: 13, color: tenueD},
      x: {type: "utc", label: null, ticks: d3.utcMonth.every(1), tickFormat: (d) => mesesD[d.getUTCMonth()]},
      y: {domain: [0, Math.ceil(d3.max(anio, (d) => d.views) / 10000) * 10000], label: null, ticks: 5, tickFormat: fmtNumD},
      marks: [
        Plot.gridY({ticks: 5, stroke: grillaD, strokeOpacity: 1}),
        Plot.ruleY([0], {stroke: grillaD}),
        Plot.dot(anio, {x: "date", y: "views", r: 2, fill: grisD}),
        Plot.lineY(anio, {x: "date", y: "media7", stroke: azulD, strokeWidth: 2}),
        Plot.dot(zocalo, {x: "date", y: "views", r: 4.5, fill: azulD, stroke: "white", strokeWidth: 2}),
        Plot.text(zocalo, {x: "date", y: "views", text: "label", textAnchor: "start", dx: 10, fill: tintaD}),
        Plot.ruleX(anio, Plot.pointerX({x: "date", stroke: tenueD, strokeDasharray: "3,3"})),
        Plot.tip(anio, Plot.pointerX({x: "date", y: "views", title: (d) => `${fmtDiaD(d.date)}\nEse día: ${fmtNumD(d.views)}\nMedia 7 días: ${fmtNumD(d.media7)}`}))
      ]
    });

    display(graficoDiario);
  </script>
