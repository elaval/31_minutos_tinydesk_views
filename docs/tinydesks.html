<!doctype html>
<notebook theme="glacier">
  <title>Untitled</title>
  <script id="1" type="module" hidden="">
    // Snapshot de todos los Tiny Desk (scripts/snapshot_tinydesks.py), leído desde el sitio
    // publicado para que funcione igual en Observable Desktop y en GitHub Pages
    const data = await fetch("https://elaval.github.io/31_minutos_tinydesk_views/file.json").then((d) => d.json());
  </script>
  <script id="3" type="module" hidden="">
    // Períodos para filtrar; "N años" se cuenta hacia atrás desde el video más reciente del snapshot
    const ultimo = new Date(d3.max(data, (d) => d.publishedAt));
    const haceAnios = (n) => new Date(Date.UTC(ultimo.getUTCFullYear() - n, ultimo.getUTCMonth(), ultimo.getUTCDate())).toISOString();
    const periodos = new Map([
      ["Desde el regreso al estudio tras la pandemia (may 2022)", {desde: "2022-05-28", titulo: "Desde el regreso tras la pandemia"}],
      ["Últimos 4 años", {desde: haceAnios(4), titulo: "Últimos 4 años"}],
      ["Últimos 5 años", {desde: haceAnios(5), titulo: "Últimos 5 años"}],
      ["Todo el período (desde 2009)", {desde: "2008-01-01", titulo: "Todo el período"}]
    ]);
    const periodo = view(Inputs.radio(periodos, {label: "Período", value: periodos.get("Desde el regreso al estudio tras la pandemia (may 2022)")}));
  </script>
  <script id="2" type="module" hidden="">
    const {desde, titulo} = periodo;
    const todo = desde < "2009";
    // En el período completo hay ~160 videos sobre 5 M; con nombre solo los de 10 M o más
    const limiteAlto = todo ? 10000000 : 5000000;

    const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const fmtDia = (iso) => {
      const d = new Date(iso);
      return `${d.getUTCDate()} ${meses[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    };
    // Hasta ~2021 el título era "Artista: NPR Music Tiny Desk Concert"; después, "Artista: Tiny Desk Concert"
    const artista = (d) => d.title.match(/(.*?): NPR Music Tiny/)?.[1] ?? d.title.match(/(.*): Tiny/)?.[1] ?? d.title;

    const datos = data
      .filter((d) => d.publishedAt >= desde)
      .map((d) => ({...d, views: +d.viewCount, fecha: new Date(d.publishedAt)}))
      .sort((a, b) => b.fecha - a.fecha);
    const hasta = datos[0].publishedAt;

    const altos = datos.filter((d) => d.views >= limiteAlto);
    const bajos = datos.filter((d) => d.views < limiteAlto);
    const minutos = datos.filter((d) => /Minutos/.test(d.title));

    const imagen = (subset, r) =>
      Plot.image(subset, {
        x: "views",
        y: "fecha",
        src: "url",
        r,
        preserveAspectRatio: "xMidYMin slice",
        channels: {artista: {value: artista, label: "Artista"}, publicado: {value: (d) => fmtDia(d.publishedAt), label: "Publicado"}},
        tip: {format: {artista: true, publicado: true, x: (v) => v.toLocaleString("es-CL"), y: false, src: false}}
      });

    const grafico = Plot.plot({
      title: "Tiny Desk en estudios de NPR - Visualizaciones en YouTube",
      subtitle: `${titulo}: ${datos.length} presentaciones desde ${fmtDia(datos.at(-1).publishedAt)} hasta ${fmtDia(hasta)}${todo ? " · con nombre las de 10 M o más" : ""}`,
      caption: "Fuente: YouTube Data API v3, playlist «NPR Music Tiny Desk Concerts». Conteos de visualizaciones a la fecha del snapshot. Gráfico: @elaval · MindTheContext.",
      width,
      height: todo ? 1000 : 600,
      marginLeft: 50,
      marginRight: 100,
      marginBottom: 50,
      marginTop: 50,
      y: {type: "time", label: "Fecha", tickPadding: 20},
      x: {label: "Visualizaciones en YouTube", grid: true, type: "linear"},
      marks: [
        Plot.dot(minutos, {x: "views", y: "fecha", r: 25, fill: "yellow"}),
        imagen(altos, 15),
        imagen(bajos, 10),
        Plot.text(altos, {x: "views", y: "fecha", text: artista, dy: 30}),
        Plot.ruleX([0])
      ]
    });

    display(grafico);
  </script>
</notebook>
